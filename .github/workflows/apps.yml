# Monta os instaladores dos apps na nuvem do GitHub (sem instalar nada no PC):
#   Windows (.msi / .exe), Linux (.deb / .AppImage), Android (.apk) e, se pedido, Mac (.dmg).
# Rodar: GitHub → Actions → "Apps (instaladores)" → Run workflow.
# Os arquivos ficam em "Artifacts", no fim da execução.
name: Apps (instaladores)

on:
  workflow_dispatch:
    inputs:
      mac:
        description: "Montar também para Mac (no GitHub, minuto de Mac conta 10x)"
        type: boolean
        default: false
      beta_url:
        description: "Versão beta: endereço do servidor de teste (vazio = app normal, que pergunta o endereço)"
        type: string
        default: ""
      beta_discovery:
        description: "Versão beta: endereço fixo (gist raw) que informa o link atual, para os apps acharem o link novo sozinhos"
        type: string
        default: ""

jobs:
  desktop:
    name: Computador (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows }
          - { os: ubuntu-22.04, label: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas do Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Preparar versão beta
        if: inputs.beta_url != ''
        shell: bash
        run: node apps/preparar-beta.mjs "${{ inputs.beta_url }}" "${{ inputs.beta_discovery }}"
      - name: Montar
        working-directory: apps/desktop
        run: |
          npm install
          npx tauri icon ../mobile/assets/icon.png
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.label }}${{ inputs.beta_url != '' && '-beta' || '' }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  mac:
    name: Computador (Mac)
    if: inputs.mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Preparar versão beta
        if: inputs.beta_url != ''
        shell: bash
        run: node apps/preparar-beta.mjs "${{ inputs.beta_url }}" "${{ inputs.beta_discovery }}"
      - name: Montar
        working-directory: apps/desktop
        run: |
          npm install
          npx tauri icon ../mobile/assets/icon.png
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: app-Mac${{ inputs.beta_url != '' && '-beta' || '' }}
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  android:
    name: Celular (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Preparar versão beta
        if: inputs.beta_url != ''
        run: node apps/preparar-beta.mjs "${{ inputs.beta_url }}" "${{ inputs.beta_discovery }}"
      - name: Montar APK
        working-directory: apps/mobile
        run: |
          npm install
          npx cap add android
          node scripts/android-rede.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#2563eb'
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-Android${{ inputs.beta_url != '' && '-beta' || '' }}
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk

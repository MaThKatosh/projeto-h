# Banco de desenvolvimento do Projeto H (sistema hoteleiro).
# Credenciais vêm do arquivo .env (não versionado). Veja .env.example.
services:
  db:
    image: postgres:17-alpine
    container_name: hotel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-hotel}
    ports:
      # Apenas na interface local: o banco não fica exposto na rede.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hotel_pgdata:

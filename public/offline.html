<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  .box { max-width: 380px; margin: 16px; padding: 28px; background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 16px; background: #2563eb; color: #fff; font: 900 28px/56px Arial, sans-serif; }
  p { color: #52525b; font-size: 14px; }
  button { margin-top: 8px; padding: 10px 18px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">H</div>
    <h1 style="font-size:20px">Sem conexão com o servidor</h1>
    <p id="pt">Confira o Wi-Fi ou a rede do hotel. Se só este aparelho está sem acesso, avise a gerência.</p>
    <p lang="en">No connection to the hotel server. · <span lang="es">Sin conexión con el servidor del hotel.</span></p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
